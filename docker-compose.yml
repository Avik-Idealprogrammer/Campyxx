services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/create-dev-env.sh first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/create-dev-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/create-dev-env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run scripts/create-dev-env.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_SEED_USERS: ${DEMO_SEED_USERS:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?Run scripts/create-dev-env.sh first}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run scripts/create-dev-env.sh first}
      DEMO_FACULTY_EMAIL: ${DEMO_FACULTY_EMAIL:?Run scripts/create-dev-env.sh first}
      DEMO_FACULTY_PASSWORD: ${DEMO_FACULTY_PASSWORD:?Run scripts/create-dev-env.sh first}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:?Run scripts/create-dev-env.sh first}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:?Run scripts/create-dev-env.sh first}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata: